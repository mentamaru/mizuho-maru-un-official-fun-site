name: Summarize Collected Information

on:
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * *'

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flatt-security/setup-takumi-guard-npm@v1
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run summarize
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 要約データを更新
          title: 要約データを更新
          body: |
            収集済み情報だけを入力として generated summaries を更新しました。
          branch: automation/update-summaries
