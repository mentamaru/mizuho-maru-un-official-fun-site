name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.136.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          semgrep scan --metrics=off --error
          --config p/default --config p/security-audit --config p/owasp-top-ten
          --config p/javascript --config p/typescript
          --exclude node_modules --exclude dist --exclude .astro .

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 2026-03のtrivy-action / setup-trivyタグ書き換え事故を踏まえ、第三者Actionを使わずimageをdigest固定で実行する
      - run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --include-dev-deps --exit-code 1
          --skip-dirs node_modules,dist,.astro /src

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
