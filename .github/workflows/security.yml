name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.136.0
    steps:
      - uses: actions/checkout@v7
      - run: >-
          semgrep scan --metrics=off --error
          --config p/javascript --config p/typescript --config p/security-audit
          --exclude node_modules --exclude dist --exclude .astro .

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
