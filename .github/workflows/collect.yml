name: Collect Official Information

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flatt-security/setup-takumi-guard-npm@v1
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 公式情報収集を更新
          title: 公式情報収集を更新
          body: |
            定期または手動実行により generated items を更新しました。
          branch: automation/collect-items
