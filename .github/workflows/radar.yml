name: Collect Mizuho-maru Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 4'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mizuho-maru-data-collectors
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    environment: collector-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect:radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Set radar month
        run: echo "RADAR_MONTH=$(TZ=Asia/Tokyo date +%Y-%m)" >> "$GITHUB_ENV"
      - id: changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run verify:radar-changes
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run lint
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run typecheck
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run test:unit
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run build
      - if: steps.changed.outputs.has_changes == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run test:e2e
      - name: Create scoped collector App token
        if: steps.changed.outputs.has_changes == 'true'
        id: collector-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.COLLECTOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.collector-token.outputs.token }}
          COLLECTOR_TOKEN: ${{ steps.collector-token.outputs.token }}
          COLLECTOR_APP_SLUG: ${{ steps.collector-token.outputs.app-slug }}
        run: |
          bot_login="${COLLECTOR_APP_SLUG}[bot]"
          bot_id=$(gh api "users/$bot_login" --jq .id)
          [[ "$bot_id" =~ ^[0-9]+$ ]]
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"
          npm run verify:radar-changes
          git add "data/radar/$RADAR_MONTH.json"
          git commit -m 'みずほまるレーダーを更新'
          bash scripts/push-collector.sh
