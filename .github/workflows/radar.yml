name: Collect Mizuho-maru Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 4'

permissions:
  contents: write
  id-token: write

concurrency:
  group: mizuho-maru-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flatt-security/setup-takumi-guard-npm@v1
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect:radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RADAR_MODEL: ${{ vars.OPENAI_RADAR_MODEL }}
      - id: changed
        run: |
          if git diff --quiet; then echo "has_changes=false" >> "$GITHUB_OUTPUT"; else echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.has_changes == 'true'
        run: RADAR_MONTH=$(TZ=Asia/Tokyo date +%Y-%m) npm run verify:radar-changes
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run lint
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run typecheck
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run test:unit
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run build
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run test:e2e
      - if: steps.changed.outputs.has_changes == 'true'
        run: |
          RADAR_MONTH=$(TZ=Asia/Tokyo date +%Y-%m) npm run verify:radar-changes
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/radar/$RADAR_MONTH.json"
          git commit -m 'みずほまるレーダーを更新'
          git push origin HEAD:main
