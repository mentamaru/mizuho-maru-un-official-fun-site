name: Collect Official Information

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 4'

permissions:
  contents: write
  id-token: write

concurrency:
  group: mizuho-maru-data-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flatt-security/setup-takumi-guard-npm@v1
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect:official
      - id: changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run verify:official-changes
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run lint
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run typecheck
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run test:unit
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run build
      - if: steps.changed.outputs.has_changes == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changed.outputs.has_changes == 'true'
        run: npm run test:e2e
      - if: steps.changed.outputs.has_changes == 'true'
        run: |
          npm run verify:official-changes
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/official/$OFFICIAL_MONTH.json"
          git commit -m '公式情報を更新'
          git push origin HEAD:main
